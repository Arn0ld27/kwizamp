<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Host · KwizKamp</title>
<link rel="stylesheet" href="/style.css" />
</head>
<body class="host-body">
  <div class="host-shell">

    <!-- LEFT: ROSTER -->
    <aside class="host-sidebar">
      <div class="host-brand"><span>⚡</span><h2>KwizKamp</h2></div>
      <div class="roster-count"><span id="rosterCount">0</span> camper(s) here</div>
      <div class="roster-list" id="rosterList"></div>
    </aside>

    <!-- CENTER: STAGE -->
    <main class="host-main">

      <div class="host-topbar">
        <span class="pill" id="statusPill">Lobby</span>
        <button class="btn btn-ghost" id="newGameBtn">↺ New game</button>
      </div>

      <div class="progress-track"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>

      <div class="host-stage panel">

        <!-- LOBBY -->
        <div id="stageLobby">
          <p style="color:var(--text-muted); margin-bottom: 18px;">Players join at <strong id="playUrl">/play</strong> on this Wi-Fi.</p>
          <div class="duration-row" style="justify-content:center;">
            <label for="durationSlider" style="color:var(--text-muted); font-weight:700;">Time per question</label>
            <input type="range" id="durationSlider" min="5" max="60" value="20" />
            <span id="durationLabel">20s</span>
          </div>
          <div style="margin-top: 22px;">
            <button class="btn btn-primary" id="startBtn" disabled>Start quiz</button>
          </div>
        </div>

        <!-- GET READY -->
        <div id="stageGetReady" class="hidden">
          <p class="host-question-preview">Get ready — Question <span id="grHostNum">1</span> of <span id="grHostTotal">5</span></p>
        </div>

        <!-- QUESTION -->
        <div id="stageQuestion" class="hidden">
          <div class="pill" id="qCounter">Q 1 / 5</div>
          <p class="host-question-preview" id="hostQuestionText">—</p>
          <div class="pill" id="answerCount">0 / 0 answered</div>
          <div class="host-controls">
            <button class="btn btn-primary" id="revealBtn">Reveal answer</button>
          </div>
        </div>

        <!-- REVEAL -->
        <div id="stageReveal" class="hidden">
          <p class="host-question-preview">Correct answer: <span id="revealCorrectText" style="color:var(--cool);">—</span></p>
          <div class="host-controls">
            <button class="btn btn-primary" id="nextBtn">Next question</button>
          </div>
        </div>

        <!-- ENDED -->
        <div id="stageEnded" class="hidden">
          <p class="host-question-preview">🏁 Quiz complete!</p>
          <div class="host-controls">
            <button class="btn btn-cool" id="showResultsBtn">Show ranking on display</button>
            <a class="btn btn-ghost" id="exportBtn" href="/export-results.csv" download>⬇ Export results (CSV)</a>
          </div>
        </div>

      </div>

      <div class="host-controls" style="justify-content:flex-start;">
        <label class="pill" style="cursor:pointer;">
          <input type="checkbox" id="phoneToggle" checked style="accent-color: var(--ember);" />
          Show question text on phones
        </label>
      </div>
    </main>

    <!-- RIGHT: LEADERBOARD -->
    <aside class="host-side-right">
      <h2 style="font-size:1rem; color:var(--text-muted); margin-bottom: 12px;">Leaderboard</h2>
      <div class="leaderboard-mini" id="leaderboardMini"></div>
    </aside>

  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/host.js"></script>
</body>
</html>
