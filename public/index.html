<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>KwizKamp</title>
<link rel="stylesheet" href="/style.css" />
<style>
  /* ---------- LANDING — page-scoped enhancements only ---------- */

  .landing {
    position: relative;
    z-index: 2;
  }

  /* Soft aurora orbs behind the landing */
  .landing::before,
  .landing::after {
    content: '';
    position: fixed;
    border-radius: 50%;
    filter: blur(110px);
    pointer-events: none;
    z-index: 0;
    opacity: 0.35;
  }
  .landing::before {
    width: 60vw;
    height: 60vw;
    top: -20%;
    left: -15%;
    background: radial-gradient(circle, rgba(255, 159, 67, 0.55), transparent 70%);
    animation: kwDriftA 18s ease-in-out infinite alternate;
  }
  .landing::after {
    width: 55vw;
    height: 55vw;
    bottom: -25%;
    right: -15%;
    background: radial-gradient(circle, rgba(78, 205, 196, 0.35), transparent 70%);
    animation: kwDriftB 22s ease-in-out infinite alternate;
  }
  @keyframes kwDriftA {
    0%   { transform: translate(0,0) scale(1); }
    100% { transform: translate(10vw, 8vh) scale(1.15); }
  }
  @keyframes kwDriftB {
    0%   { transform: translate(0,0) scale(1.05); }
    100% { transform: translate(-8vw, -6vh) scale(0.9); }
  }

  /* Live badge */
  .landing .live-badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 6px 14px;
    border-radius: 999px;
    background: rgba(255, 90, 60, 0.10);
    border: 1px solid rgba(255, 90, 60, 0.35);
    color: #ff8a70;
    font-family: var(--font-head);
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    margin-bottom: 18px;
    position: relative;
    z-index: 1;
  }
  .landing .live-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #ff5a3c;
    box-shadow: 0 0 0 0 rgba(255, 90, 60, 0.7);
    animation: kwLivePulse 1.8s infinite;
  }
  @keyframes kwLivePulse {
    0%   { box-shadow: 0 0 0 0 rgba(255, 90, 60, 0.7); }
    70%  { box-shadow: 0 0 0 10px rgba(255, 90, 60, 0); }
    100% { box-shadow: 0 0 0 0 rgba(255, 90, 60, 0); }
  }

  /* Logo mark */
  .landing .logo-mark {
    position: relative;
    font-size: 3.6rem;
    filter: drop-shadow(0 0 22px rgba(255, 159, 67, 0.6));
    animation: kwLogoFloat 4s ease-in-out infinite;
    z-index: 1;
  }
  @keyframes kwLogoFloat {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-6px); }
  }

  /* Tagline divider */
  .landing p.tagline {
    position: relative;
    z-index: 1;
    padding-bottom: 1.2rem;
    border-bottom: 1px dashed rgba(255, 159, 67, 0.25);
    margin-bottom: 36px !important;
  }

  /* ---------- ROLE GRID — now holds only the single Join card ---------- */
  .landing .role-grid {
    position: relative;
    z-index: 1;
    display: flex;
    justify-content: center;
    align-items: center;
    width: 100%;
    max-width: 380px;
    margin: 0 auto;
    grid-template-columns: none; /* neutralize any grid rules from style.css */
  }

  /* ---------- JOIN CARD — hero-style, centered ---------- */
  .landing .role-card {
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    gap: 10px;
    padding: 40px 32px;
    width: 100%;
    background: linear-gradient(180deg, var(--bg-panel-2) 0%, var(--bg-panel) 100%);
    border: 1px solid rgba(255, 159, 67, 0.35);
    border-radius: var(--radius-lg);
    box-shadow:
      0 22px 45px -15px rgba(255, 140, 0, 0.35),
      var(--shadow-panel);
    transition: transform 0.25s cubic-bezier(0.25, 0.46, 0.45, 0.94),
                border-color 0.25s ease,
                box-shadow 0.3s ease;
  }

  .landing .role-card::before {
    content: '';
    position: absolute;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 70%;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--ember), transparent);
    opacity: 0.7;
  }

  .landing .role-card::after {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at 50% 0%, rgba(255, 159, 67, 0.22), transparent 65%);
    opacity: 0;
    transition: opacity 0.4s ease;
    pointer-events: none;
  }
  .landing .role-card:hover::after { opacity: 1; }

  .landing .role-card:hover {
    transform: translateY(-6px) scale(1.015);
    border-color: rgba(255, 190, 80, 0.85);
    box-shadow:
      0 28px 55px -15px rgba(255, 140, 0, 0.55),
      var(--shadow-panel);
  }

  .landing .role-card .icon {
    position: relative;
    z-index: 1;
    font-size: 2.8rem;
    filter: drop-shadow(0 0 14px rgba(255, 159, 67, 0.5));
    transition: transform 0.35s ease;
  }
  .landing .role-card:hover .icon {
    transform: scale(1.1) translateY(-2px);
  }

  .landing .role-card .name {
    position: relative;
    z-index: 1;
    font-size: 2rem;
    letter-spacing: 0.5px;
    background: linear-gradient(180deg, var(--glow), var(--ember));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .landing .role-card .desc {
    position: relative;
    z-index: 1;
    font-size: 0.92rem;
    line-height: 1.5;
    color: var(--text-muted);
  }

  /* Footer note */
  .landing .footer-note {
    position: relative;
    z-index: 1;
    margin-top: 36px;
    font-size: 0.72rem;
    letter-spacing: 1.6px;
    text-transform: uppercase;
    color: #5f6880;
  }

  @media (max-width: 620px) {
    .landing::before, .landing::after { filter: blur(80px); }
    .landing .role-card { padding: 34px 24px; }
    .landing .role-card .name { font-size: 1.7rem; }
  }
</style>
</head>
<body>
  <div class="embers" id="embers"></div>
  <div class="landing">

    <div class="live-badge" aria-hidden="true">
      <span class="live-dot"></span>
      Live quiz
    </div>

    <div class="logo-mark">⚡</div>
    <h1>KwizKamp</h1>
    <p class="tagline">A live quiz for your room. No accounts, no cloud — just a laptop, some phones, and a screen.</p>

    <!-- Only the Join card remains. Host & Display removed from the landing. -->
    <div class="role-grid">
      <a class="role-card panel" href="/play">
        <span class="icon">📱</span>
        <span class="name">Join</span>
        <span class="desc">Tap to enter the game</span>
      </a>
    </div>

    <p class="footer-note">Ask the host for the room code</p>
  </div>

  <script>
    const layer = document.getElementById('embers');
    for (let i = 0; i < 18; i++) {
      const s = document.createElement('span');
      s.style.left = Math.random() * 100 + 'vw';
      s.style.setProperty('--drift', (Math.random() * 60 - 30) + 'px');
      s.style.animationDuration = (6 + Math.random() * 8) + 's';
      s.style.animationDelay = (Math.random() * 8) + 's';
      layer.appendChild(s);
    }
  </script>
</body>
</html>
