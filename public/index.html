<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Join Quiz · KwizKamp</title>
<link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="quiz-wrapper landing-wrapper">
    <div class="logo-badge landing-logo">
      <span>⚡</span>
      <h1>KwizKamp</h1>
    </div>
    <p class="landing-sub">Enter your name and pick an avatar</p>
    <form id="joinForm" class="join-form">
      <input type="text" id="nameInput" placeholder="Your name" maxlength="20" autocomplete="off" required />

      <div class="avatar-picker-label">Pick your avatar:</div>
      <div class="avatar-picker" id="avatarPicker"></div>

      <button type="submit" class="next-btn landing-btn">JOIN →</button>
    </form>
   <!-- <p class="landing-hint">Host? <a href="/host">Host panel</a> · <a href="/display">Display</a></p>-->
  </div>

  <script>
    const AVATARS = ['🐶','🐱','🦊','🐼','🐸','🦁','🐯','🐨','🐵','🦄','👾','🤖','👽','🎃','👻','🦖','🐲','🦅','🐢','🦋'];
    let selectedAvatar = AVATARS[0];

    const picker = document.getElementById('avatarPicker');
    AVATARS.forEach((a, i) => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'avatar-option' + (i === 0 ? ' selected' : '');
      btn.textContent = a;
      btn.addEventListener('click', () => {
        document.querySelectorAll('.avatar-option').forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
        selectedAvatar = a;
      });
      picker.appendChild(btn);
    });

    document.getElementById('joinForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const name = document.getElementById('nameInput').value.trim();
      if (!name) return;
      sessionStorage.setItem('playerName', name);
      sessionStorage.setItem('playerAvatar', selectedAvatar);
      window.location.href = '/play';
    });
  </script>
</body>
</html>
