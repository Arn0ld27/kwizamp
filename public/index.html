<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>KwizKamp</title>
<link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="embers" id="embers"></div>
  <div class="landing">
    <div class="logo-mark">⚡</div>
    <h1>KwizKamp</h1>
    <p class="tagline">A live quiz for your room. No accounts, no cloud — just a laptop, some phones, and a screen.</p>

    <div class="role-grid">
      <a class="role-card panel" href="/host">
        <span class="icon">🎓</span>
        <span class="name">Host</span>
        <span class="desc">Run the game from here</span>
      </a>
      <a class="role-card panel" href="/display">
        <span class="icon">🖥️</span>
        <span class="name">Display</span>
        <span class="desc">Put this on the big screen</span>
      </a>
      <a class="role-card panel" href="/play">
        <span class="icon">📱</span>
        <span class="name">Join</span>
        <span class="desc">Players open this on their phone</span>
      </a>
    </div>
  </div>

  <script>
    const layer = document.getElementById('embers');
    for (let i = 0; i < 18; i++) {
      const s = document.createElement('span');
      s.style.left = Math.random() * 100 + 'vw';
      s.style.setProperty('--drift', (Math.random() * 60 - 30) + 'px');
      s.style.animationDuration = (6 + Math.random() * 8) + 's';
      s.style.animationDelay = (Math.random() * 8) + 's';
      layer.appendChild(s);
    }
  </script>
</body>
</html>
