<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Display · KwizKamp</title>
<link rel="stylesheet" href="/style.css" />
</head>
<body class="display-body">
  <div class="display-wrapper">

    <!-- REACTION LAYER (floating emojis) -->
    <div id="reactionLayer" class="reaction-layer"></div>

    <!-- IDLE -->
    <div id="viewIdle" class="display-view">
      <div class="logo-badge display-logo">
        <span>⚡</span>
        <h1>KwizKamp</h1>
      </div>
      <p class="display-idle-text">Waiting for host to start the quiz...</p>
    </div>

    <!-- QUESTION -->
    <div id="viewQuestion" class="display-view hidden">
      <div class="display-top">
        <span id="displayQNum">Q 1 / 5</span>
        <span class="display-timer" id="displayTimer">⏱ 20s</span>
      </div>
      <div class="display-question-text" id="displayQuestion">—</div>
    </div>

    <!-- REVEAL -->
    <div id="viewReveal" class="display-view hidden">
      <div class="display-top">
        <span id="displayQNum2">Q 1 / 5</span>
      </div>
      <div class="display-question-text" id="displayQuestion2">—</div>
      <div class="display-correct" id="displayCorrect">✅ —</div>
      <div class="display-counts" id="displayCounts"></div>
    </div>

    <!-- RANKING -->
    <div id="viewRanking" class="display-view hidden">
      <h1 class="ranking-title">🏆 FINAL RANKING</h1>
      <div class="ranking-chart" id="rankingChart"></div>
    </div>

  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/display.js"></script>
</body>
</html>
